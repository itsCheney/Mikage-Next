name: Mikage
options:
  bundleIdPrefix: moe.cheney233
  deploymentTarget:
    iOS: '16.0'
  developmentLanguage: en
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    MIKAGE_SOURCE_REVISION: unknown
    # Mikage's app from bgm.tv/dev/app. Empty leaves Bangumi on pasted
    # access tokens; filled in, Bangumi signs in on its website.
    BANGUMI_APP_ID: ''
    BANGUMI_APP_SECRET: ''
    BANGUMI_REDIRECT_URI: mikage://bangumi/callback
packages:
  VNCore:
    path: .
targets:
  Mikage:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: VNCore
      - framework: build/KRKRRuntime.xcframework
        embed: true
      - framework: build/ONSRuntime.xcframework
        embed: true
      # One SDL3 shared by every engine runtime (scripts/build-sdl3-ios.sh).
      - framework: build/SDL3.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: moe.cheney233.mikage
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  MikageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MikageTests
    dependencies:
      - target: Mikage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mikage:
    build:
      targets:
        Mikage: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MikageTests

    archive:
      config: Release
