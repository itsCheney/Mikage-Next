name: Mikage
options:
  bundleIdPrefix: moe.cheney233
  deploymentTarget:
    iOS: '16.0'
  developmentLanguage: en
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    MIKAGE_SOURCE_REVISION: unknown
    # Mikage's app from bgm.tv/dev/app. Empty leaves Bangumi on pasted
    # access tokens; filled in, Bangumi signs in on its website.
    BANGUMI_APP_ID: ''
    BANGUMI_APP_SECRET: ''
    BANGUMI_REDIRECT_URI: mikage://bangumi/callback
packages:
  VNCore:
    path: .
targets:
  Mikage:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: VNCore
      - framework: build/KRKRRuntime.xcframework
        embed: true
      - framework: build/ONSRuntime.xcframework
        embed: true
      - framework: build/ArtemisRuntime.xcframework
        embed: true
      - framework: build/RenPyRuntime.xcframework
        embed: true
      - framework: build/SiglusRuntime.xcframework
        embed: true
      # OpenGL ES on Metal, which the shared SDL3 links for GL windows
      # (Ren'Py) instead of Apple's deprecated OpenGLES.
      - framework: build/MetalANGLE.xcframework
        embed: true
      # One SDL3 shared by every engine runtime (scripts/build-sdl3-ios.sh).
      - framework: build/SDL3.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: moe.cheney233.mikage
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # The built-in games step reads the Ren'Py submodule.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      # Ren'Py's The Question (MIT, from the Ren'Py submodule) ships as a
      # built-in test game; the app copies it into the library once.
      - name: Copy built-in games
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          source="${SRCROOT}/Engine/RenPyRuntime/Source/the_question"
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BuiltInGames/renpy/The Question"
          if [ ! -d "${source}/game" ]; then
            echo "error: ${source}/game is missing; run git submodule update --init" >&2
            exit 1
          fi
          rm -rf "${destination}"
          mkdir -p "${destination}"
          ditto "${source}/game" "${destination}/game"
          find "${destination}/game" \( -name '*.rpyc' -o -name '*.rpymc' -o -name cache -o -name saves \) -prune -exec rm -rf {} +
          # A distributed build of The Question carries the SDK fonts its
          # language buttons use (SourceHanSansLite, Vazirmatn; both OFL) in game/.
          cp "${SRCROOT}/Engine/RenPyRuntime/Source/sdk-fonts/"*.ttf "${destination}/game/"
          cp "${source}/ios-icon.png" "${destination}/icon.png"

  MikageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MikageTests
    dependencies:
      - target: Mikage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mikage:
    build:
      targets:
        Mikage: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MikageTests

    archive:
      config: Release
