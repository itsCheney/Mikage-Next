name: VNPlayer
options:
  bundleIdPrefix: dev.vnplayer
  deploymentTarget:
    iOS: '16.0'
  developmentLanguage: zh-Hans
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  VNCore:
    path: .
targets:
  VNPlayer:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: VNCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vnplayer.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
  VNPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VNPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VNPlayer:
    build:
      targets:
        VNPlayer: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [VNPlayerUITests]
    archive:
      config: Release
