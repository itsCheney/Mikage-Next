name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Inspect toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install project generator
        run: brew install xcodegen
      - name: Test library import and persistence
        run: swift test
      - name: Cache KRKR dependencies
        uses: actions/cache@v4
        with:
          path: build/krkr-vcpkg-installed
          key: krkr-vcpkg-${{ runner.os }}-${{ runner.arch }}-8e8dfb4ba483886936ded5ca201b500b8d8b0096
      - name: Build KRKR runtime framework
        run: |
          mkdir -p build
          set -o pipefail
          bash scripts/build-krkr-ios.sh 2>&1 | tee build/krkr-runtime-build.log
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: bash scripts/build-ios.sh
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/Mikage.app build/package/Payload/Mikage.app
          cd build/package
          ditto -c -k --keepParent Payload ../Mikage-unsigned.ipa
      - name: Upload device build
        uses: actions/upload-artifact@v4
        with:
          name: Mikage-unsigned-${{ github.run_number }}
          path: build/Mikage-unsigned.ipa
          if-no-files-found: error
      - name: Choose available iPhone simulator
        run: |
          xcrun simctl list devices available -j > build/devices.json
          python3 scripts/select-simulator.py >> "$GITHUB_ENV"
      - name: Exercise UI and capture screenshots
        run: |
          set -o pipefail
          xcodebuild test -project Mikage.xcodeproj -scheme Mikage \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/SimulatorData -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build/ui-tests.log
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi
      - name: Upload build logs and UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mikage-validation-${{ github.run_number }}
          path: |
            build/*.log
            build/*.xcresult
            build/screenshots/
          if-no-files-found: ignore
